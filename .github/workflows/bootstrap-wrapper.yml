name: Bootstrap Gradle wrapper

on:
  push:
    branches:
      - feature/pedometer-mvp

permissions:
  contents: write

jobs:
  wrapper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pedometer-mvp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git diff --cached --quiet && exit 0
          git commit -m "chore: add Gradle wrapper"
          git push origin HEAD:feature/pedometer-mvp
